<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>俞浩然 · 个人主页</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: #0f172a;
            font-family: 'Segoe UI', Roboto, '微软雅黑', sans-serif;
            color: #e2e8f0;
            padding: 20px;
        }
        .video-box {
            max-width: 900px;
            margin: 0 auto 30px;
            border-radius: 24px;
            overflow: hidden;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
            background: black;
        }
        .video-box iframe {
            width: 100%;
            height: 500px;
            display: block;
            border: none;
        }
        .card {
            max-width: 900px;
            margin: 0 auto;
            background: #1e293b;
            border-radius: 28px;
            padding: 28px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.2);
        }
        h1 {
            text-align: center;
            font-size: 2rem;
            color: #facc15;
            margin-bottom: 20px;
        }
        h2 {
            background: #f97316;
            display: inline-block;
            padding: 5px 18px;
            border-radius: 30px;
            font-size: 1.25rem;
            margin: 20px 0 15px;
            color: #0f172a;
        }
        .info-list {
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            list-style: none;
            margin: 10px 0;
        }
        .info-list li {
            background: #0f172a;
            padding: 6px 18px;
            border-radius: 40px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            background: #0f172a;
            border-radius: 16px;
            overflow: hidden;
            margin: 12px 0;
        }
        th, td {
            border: 1px solid #334155;
            padding: 10px;
            text-align: center;
        }
        th {
            background: #f97316;
            color: #0f172a;
        }
        a {
            color: #facc15;
            text-decoration: none;
        }
        .center {
            text-align: center;
        }
        img {
            border-radius: 50%;
            display: block;
            margin: 0 auto;
            border: 2px solid #facc15;
            transition: 0.2s;
        }
        img:hover {
            transform: scale(1.02);
        }
        hr {
            margin: 20px 0;
            border-color: #334155;
        }
        footer {
            text-align: center;
            margin-top: 25px;
            font-size: 0.8rem;
            color: #94a3b8;
        }
        @media (max-width: 700px) {
            .video-box iframe {
                height: 280px;
            }
            .card {
                padding: 18px;
            }
            h1 {
                font-size: 1.5rem;
            }
        }
    </style>
</head>
