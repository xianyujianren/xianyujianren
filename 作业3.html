<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>轮播+菜单</title>
    <style>
        #container {
            position: relative;
            width: 600px;
            height: 400px;
            border: 3px solid #333;
            overflow: hidden;
            margin-bottom: 40px;
        }
        #list {
            position: absolute;
            z-index: 1;
            width: 2400px;
            height: 400px;
            left: 0px;
        }
        #list img {
            float: left;
            width: 600px;
            height: 400px;
        }
        #buttons {
            position: absolute;
            left: 250px;
            bottom: 20px;
            z-index: 2;
            height: 10px;
            width: 100px;
        }
        #buttons span {
            float: left;
            margin-right: 5px;
            width: 10px;
            height: 10px;
            border: 1px solid #fff;
            border-radius: 50%;
            background: #333;
            cursor: pointer;
        }
        #buttons .on {
            background: orangered;
        }
        .arrow {
            position: absolute;
            top: 180px;
            z-index: 2;
            width: 40px;
            height: 40px;
            font-size: 36px;
            font-weight: bold;
            line-height: 39px;
            text-align: center;
            color: #fff;
            background-color: RGBA(0, 0, 0, 0.3);
            cursor: pointer;
            text-decoration: none;
        }
        .arrow:hover {
            background-color: RGBA(0, 0, 0, 0.7);
        }
        #prev { left: 20px; }
        #next { right: 20px; }

        /* 菜单样式 */
        #nav {
            position: fixed;
            right: 20px;
            top: 50%;
            transform: translateY(-50%);
            background: white;
            border: 1px solid #ccc;
            padding: 10px;
            list-style: none;
            margin: 0;
            z-index: 100;
        }
        #nav li {
            margin: 8px 0;
        }
        #nav a {
            color: blue;
            text-decoration: underline;
            font-size: 14px;
        }
        #nav a.active {
            font-weight: bold;
            color: darkblue;
        }

        /* 内容样式 */
        .title {
            background-color: #eee;
            padding: 8px;
            margin-top: 30px;
            font-size: 24px;
            font-weight: bold;
        }
        p {
            margin: 10px 0;
        }
    </style>
</head>
<body>

<!-- 轮播图 -->
<div id="container">
    <div id="list">
        <img src="https://picsum.photos/id/1015/600/400" alt="1">
        <img src="https://picsum.photos/id/104/600/400" alt="2">
        <img src="https://picsum.photos/id/107/600/400" alt="3">
        <img src="https://picsum.photos/id/15/600/400" alt="4">
    </div>
    <div id="buttons">
        <span index="0" class="on"></span>
        <span index="1"></span>
        <span index="2"></span>
        <span index="3"></span>
    </div>
    <a href="javascript:;" id="prev" class="arrow">&lt;</a>
    <a href="javascript:;" id="next" class="arrow">&gt;</a>
</div>

<h1 class="title" id="sec1">山景</h1>
<p>这是山景的内容，有很多美丽的山峰和云雾。</p>
<p>第二段内容，随便填充。</p>
<p>第三段，让页面长一点。</p>

<h1 class="title" id="sec2">水景</h1>
<p>湖水清澈，倒映蓝天。</p>
<p>更多关于水景的描述。</p>

<h1 class="title" id="sec3">草地</h1>
<p>绿草如茵，野花遍地。</p>
<p>适合野餐和放松。</p>

<h1 class="title" id="sec4">小路</h1>
<p>林间小路，静谧美好。</p>
<p>散步的绝佳去处。</p>

<script>
    let width = 600;
    let list = document.getElementById("list");
    let prev = document.getElementById("prev");
    let next = document.getElementById("next");
    let num = list.children.length;
    let currentIdx = 0;
    let autoTimer = null;

    function animate(offset) {
        let left = parseInt(getComputedStyle(list).left);
        let newLeft = left - offset * width;
        list.style.left = newLeft + "px";
        if (newLeft <= -num * width) {
            list.style.left = "0px";
            currentIdx = 0;
        } else if (newLeft > 0) {
            list.style.left = -(num - 1) * width + "px";
            currentIdx = num - 1;
        } else {
            currentIdx = Math.abs(newLeft) / width;
        }
        let btns = document.querySelectorAll("#buttons span");
        for (let i = 0; i < btns.length; i++) {
            if (i === currentIdx) btns[i].classList.add("on");
            else btns[i].classList.remove("on");
        }
    }

    function nextSlide() { animate(1); }
    function prevSlide() { animate(-1); }

    function startAuto() {
        if (autoTimer) clearInterval(autoTimer);
        autoTimer = setInterval(nextSlide, 3000);
    }
    function stopAuto() { if (autoTimer) clearInterval(autoTimer); }

    prev.onclick = function(e) {
        e.preventDefault();
        stopAuto();
        prevSlide();
        startAuto();
    };
    next.onclick = function(e) {
        e.preventDefault();
        stopAuto();
        nextSlide();
        startAuto();
    };

    let buttons = document.querySelectorAll("#buttons span");
    for (let i = 0; i < buttons.length; i++) {
        buttons[i].onclick = (function(idx) {
            return function() {
                stopAuto();
                let currentLeft = parseInt(getComputedStyle(list).left);
                let offset = idx - currentIdx;
                animate(offset);
                startAuto();
            };
        })(i);
    }

    document.getElementById("container").addEventListener("mouseenter", stopAuto);
    document.getElementById("container").addEventListener("mouseleave", startAuto);
    startAuto();

    let titles = document.getElementsByClassName("title");
    let navUl = document.createElement("ul");
    navUl.id = "nav";
    document.body.appendChild(navUl);

    for (let i = 0; i < titles.length; i++) {
        let li = document.createElement("li");
        let a = document.createElement("a");
        a.href = "#" + titles[i].id;
        a.innerText = titles[i].innerText;
        li.appendChild(a);
        navUl.appendChild(li);
    }

    let navLinks = document.querySelectorAll("#nav a");
    let offsets = [];
    for (let t of titles) {
        offsets.push(t.offsetTop);
    }

    document.body.onscroll = function() {
        let scrollTop = document.documentElement.scrollTop;
        for (let i = offsets.length - 1; i >= 0; i--) {
            if (offsets[i] <= scrollTop + 50) {
                for (let j = 0; j < navLinks.length; j++) {
                    if (j == i) navLinks[j].classList.add("active");
                    else navLinks[j].classList.remove("active");
                }
                break;
            }
        }
    };

    window.addEventListener("resize", function() {
        for (let i = 0; i < titles.length; i++) {
            offsets[i] = titles[i].offsetTop;
        }
        document.body.onscroll();
    });
</script>
</body>
</html>
